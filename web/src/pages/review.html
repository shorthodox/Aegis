<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | AEGIS v1.0</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="fixed-header">
        <div class="logo">⚡ AEGIS <span>v1.0</span></div>
        <div class="nav-links-centered">
            <a href="index.html" class="nav-link">Home</a>
            <a href="pricing.html" class="nav-link">Pricing</a>
            <a href="reviews.html" class="nav-link active">Reviews</a>
        </div>
        <button id="portalBtn" class="portal-btn">Client Login</button>
    </header>

    <section class="feature-section" style="padding-top:120px;">
        <div class="feature-container">
            <h1 class="section-title">Share your experience</h1>
            <p style="color:var(--text-dim); max-width:760px; margin:0 auto 1.5rem;">We value honest feedback. Your ratings help us improve Aegis‑1 and prioritise features.</p>

            <div style="max-width:720px; margin: 0 auto;">
                <form id="reviewForm" class="modal-card" style="background:transparent; border:none; padding:1.5rem; max-width:720px;">
                    <div class="labeled-input">
                        <label>Name</label>
                        <input type="text" id="reviewName" class="auth-input" placeholder="Your name" required>
                    </div>
                    <div class="labeled-input">
                        <label>Email</label>
                        <input type="email" id="reviewEmail" class="auth-input" placeholder="you@example.com" required>
                    </div>
                    <div class="labeled-input">
                        <label>Rating</label>
                        <div id="starContainer" style="font-size:1.4rem; color:var(--primary-cyan);">
                            <span class="star" data-value="1">☆</span>
                            <span class="star" data-value="2">☆</span>
                            <span class="star" data-value="3">☆</span>
                            <span class="star" data-value="4">☆</span>
                            <span class="star" data-value="5">☆</span>
                        </div>
                    </div>
                    <div class="labeled-input">
                        <label>Message</label>
                        <textarea id="reviewMessage" class="auth-input" rows="6" placeholder="Tell us what you liked or what we can improve"></textarea>
                    </div>
                    <div style="text-align:right;">
                        <button id="submitReview" class="auth-submit-btn" type="submit">Submit Review</button>
                    </div>
                    <div id="reviewResult" style="margin-top:0.8rem; color:var(--text-dim);"></div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2025 AEGIS v1.0 — Sovereign Intelligence Terminal</p>
    </footer>

    <script type="module" src="../scripts/reviews.js"></script>
</body>
</html>
