<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>AEGIS Control</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/web/assets/logo/aegis-logo-32.png">
  <style>
    :root{
      --ink:#0B0C0F; --panel:#14161B; --panel2:#1A1D23; --edge:#262A31;
      --text:#EAE6DF; --dim:#8b9099; --gold:#B8966A; --red:#E0556E; --green:#5FC08C;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
         padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
         -webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:20px 16px}
    header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    header img{width:26px;height:26px}
    h1{font-size:1.05rem;margin:0;letter-spacing:.04em}
    .sub{color:var(--dim);font-size:.78rem;margin:0 0 18px;font-family:var(--mono)}

    .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
          padding:14px 15px;margin-bottom:12px}
    label{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px;text-transform:capitalize}
    .desc{color:var(--dim);font-size:.73rem;line-height:1.45;margin-bottom:10px}
    .meta{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:8px}
    .meta .over{color:var(--gold)}

    input[type=number],input[type=password]{
      width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--text);
      border-radius:8px;padding:12px;font-family:var(--mono);font-size:1rem;min-height:48px}
    input:focus-visible,.sw:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

    .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .sw{position:relative;width:58px;height:32px;flex:0 0 58px;background:var(--panel2);
        border:1px solid var(--edge);border-radius:999px;cursor:pointer;
        touch-action:manipulation;transition:background .15s,border-color .15s}
    .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
               background:var(--dim);transition:transform .15s,background .15s}
    .sw[aria-checked="true"]{background:rgba(224,85,110,.18);border-color:var(--red)}
    .sw[aria-checked="true"]::after{transform:translateX(26px);background:var(--red)}
    .sw.ok[aria-checked="true"]{background:rgba(95,192,140,.18);border-color:var(--green)}
    .sw.ok[aria-checked="true"]::after{background:var(--green)}

    button{font-family:var(--sans);font-weight:700;border-radius:9px;border:1px solid var(--edge);
           padding:14px;font-size:.92rem;min-height:50px;width:100%;cursor:pointer;
           background:var(--panel2);color:var(--text);touch-action:manipulation}
    button.primary{background:var(--gold);border-color:var(--gold);color:#14100a}
    button:disabled{opacity:.5}
    .row{display:flex;gap:10px;margin-top:10px}

    #msg{margin:14px 0 0;padding:12px 14px;border-radius:9px;font-size:.8rem;
         line-height:1.5;display:none;font-family:var(--mono);word-break:break-word}
    #msg.ok{display:block;background:rgba(95,192,140,.10);border:1px solid rgba(95,192,140,.35);color:var(--green)}
    #msg.err{display:block;background:rgba(224,85,110,.10);border:1px solid rgba(224,85,110,.35);color:var(--red)}
    .warn{background:rgba(224,85,110,.07);border:1px solid rgba(224,85,110,.28);
          border-radius:9px;padding:11px 13px;font-size:.75rem;color:#e8b8c2;
          line-height:1.5;margin-bottom:16px}
    @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/web/assets/logo/aegis-logo-96.png" alt="">
    <h1>AEGIS Control</h1>
  </header>
  <p class="sub" id="status">locked</p>

  <div class="warn">
    These change the live desk on the next scan. They are <strong>operating dials,
    not code</strong> &mdash; nothing here is committed, and <em>Reset to code
    defaults</em> always restores the values in the repo.
  </div>

  <div class="card" id="authCard">
    <label for="key">Admin key</label>
    <div class="desc">Stored only in this browser and sent with each request. Never committed.</div>
    <input type="password" id="key" inputmode="text" autocomplete="off" placeholder="ADMIN_SECRET">
    <div class="row"><button class="primary" id="unlock">Unlock</button></div>
  </div>

  <div id="controls"></div>

  <div id="actions" style="display:none">
    <div class="row"><button class="primary" id="apply">Apply changes</button></div>
    <div class="row"><button id="reset">Reset to code defaults</button></div>
  </div>

  <p id="msg"></p>
</div>

<script>
const $ = (s) => document.querySelector(s);
const KEY = 'aegis_admin_key';

function msg(text, ok) {
  const el = $('#msg');
  el.className = ok ? 'ok' : 'err';
  el.textContent = text;
}

async function api(method, body) {
  const key = localStorage.getItem(KEY) || '';
  const res = await fetch('/api/admin/runtime', {
    method: method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}

function render(controls) {
  const box = $('#controls');
  box.innerHTML = '';
  Object.keys(controls).forEach((name) => {
    const k = controls[name];
    const pretty = name.replace(/_/g, ' ');
    const changed = k.value !== k.default;
    const over = changed ? ' &middot; <span class="over">OVERRIDDEN</span>' : '';
    const div = document.createElement('div');
    div.className = 'card';
    if (k.kind === 'bool') {
      // trading_paused is the one switch whose ON state is the alarming one, so
      // it stays red; every other toggle reads green when enabled.
      const danger = (name === 'trading_paused');
      div.innerHTML =
        '<div class="toggle"><div style="flex:1">' +
          '<label>' + pretty + '</label>' +
          '<div class="desc" style="margin:0">' + k.description + '</div></div>' +
        '<div class="sw ' + (danger ? '' : 'ok') + '" role="switch" tabindex="0" ' +
             'aria-checked="' + (k.value ? 'true' : 'false') + '" ' +
             'aria-label="' + pretty + '" data-name="' + name + '"></div></div>' +
        '<div class="meta">code default: ' + k.default + over + '</div>';
    } else {
      const step = k.max <= 1 ? '0.05' : '1';
      div.innerHTML =
        '<label for="f_' + name + '">' + pretty + '</label>' +
        '<div class="desc">' + k.description + '</div>' +
        '<input type="number" id="f_' + name + '" data-name="' + name + '" ' +
               'value="' + k.value + '" min="' + k.min + '" max="' + k.max + '" ' +
               'step="' + step + '" inputmode="decimal">' +
        '<div class="meta">allowed ' + k.min + '&ndash;' + k.max +
        ' &middot; code default: ' + k.default + over + '</div>';
    }
    box.appendChild(div);
  });

  box.querySelectorAll('.sw').forEach((sw) => {
    const flip = () => sw.setAttribute('aria-checked',
      sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    sw.addEventListener('click', flip);
    sw.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
  });

  $('#actions').style.display = '';
  $('#authCard').style.display = 'none';
  $('#status').textContent = 'connected · changes apply on the next scan';
}

async function load() {
  try {
    const out = await api('GET');
    render(out.controls);
  } catch (e) {
    $('#status').textContent = 'locked';
    const rejected = String(e.message).indexOf('Admin') !== -1;
    msg(rejected ? 'That key was rejected.' : e.message, false);
    localStorage.removeItem(KEY);
    $('#authCard').style.display = '';
    $('#actions').style.display = 'none';
  }
}

$('#unlock').onclick = function () {
  const v = $('#key').value.trim();
  if (!v) { msg('Enter the admin key.', false); return; }
  localStorage.setItem(KEY, v);
  $('#key').value = '';
  $('#msg').style.display = 'none';
  load();
};

$('#apply').onclick = async function () {
  const body = {};
  document.querySelectorAll('#controls input[type=number]').forEach((i) => {
    body[i.dataset.name] = parseFloat(i.value);
  });
  document.querySelectorAll('#controls .sw').forEach((sw) => {
    body[sw.dataset.name] = sw.getAttribute('aria-checked') === 'true';
  });
  $('#apply').disabled = true;
  try {
    const out = await api('POST', body);
    render(out.controls);
    const parts = Object.keys(out.applied).map((k) => k + '=' + out.applied[k]);
    msg('Applied: ' + parts.join(', '), true);
  } catch (e) {
    msg(e.message, false);
  }
  $('#apply').disabled = false;
};

$('#reset').onclick = async function () {
  if (!confirm('Restore every control to the value committed in code?')) return;
  try {
    const out = await api('POST', { reset: true });
    render(out.controls);
    msg('Reset to code defaults.', true);
  } catch (e) {
    msg(e.message, false);
  }
};

if (localStorage.getItem(KEY)) load();
</script>
</body>
</html>
